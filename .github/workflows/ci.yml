# CI: run the Python and .NET tests on every pull request and on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: read # least privilege: the workflow only reads the repo

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classifier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: classifier/requirements*.txt
      - run: pip install -q -r requirements-test.txt
      - name: Train model (app.py needs model.joblib, which is gitignored)
        run: python train.py
      - run: pytest -q

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SteelDefectTriage.slnx -v q
